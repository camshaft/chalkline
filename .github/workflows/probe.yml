name: Probe

# The live test across networks: Chromium and Firefox, each on its own
# GitHub-hosted runner with its own public address, open one board, and the
# draw-box script joins it from a third runner. Each browser types its name,
# draws a rectangle with the mouse, and waits until it shows the other browser's
# rectangle, the script's labelled box, and the other browser's cursor with its
# name; the script waits until both browsers mark it seen. The speech job opens
# a board in each browser with a fake microphone, and records what the browser
# offers for speech recognition and what the page does with it.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      page_url:
        description: The page to test, such as https://camshaft.github.io/chalkline/. Left empty, each browser tests the branch's build.
        type: string
        required: false
      room:
        description: The room to join, such as one a browser on another network opened. Left empty, the run makes a new room.
        type: string
        required: false
      key:
        description: The room's password, given with room.
        type: string
        required: false
  workflow_call:
    inputs:
      page_url:
        description: The page to test.
        type: string
        required: true

permissions:
  contents: read

jobs:
  room:
    name: Make a room
    runs-on: ubuntu-latest
    outputs:
      room: ${{ steps.room.outputs.room }}
      key: ${{ steps.room.outputs.key }}
    steps:
      - id: room
        env:
          ROOM: ${{ inputs.room }}
          KEY: ${{ inputs.key }}
        run: |
          if [ -n "$ROOM" ] && [ -n "$KEY" ]; then
            echo "room=$ROOM" >> "$GITHUB_OUTPUT"
            echo "key=$KEY" >> "$GITHUB_OUTPUT"
          else
            echo "room=probe-$(openssl rand -hex 8)" >> "$GITHUB_OUTPUT"
            echo "key=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
          fi

  browser:
    name: Browser (${{ matrix.name }})
    needs: room
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            offset: 0
          - name: firefox
            offset: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Install ${{ matrix.name }}
        working-directory: packages/web
        # Without --with-deps: the runner image holds the libraries each browser runs on, and the
        # packages --with-deps added were fonts and video codecs, which the runner's apt mirror
        # sometimes took more than eight minutes to serve.
        timeout-minutes: 8
        run: npx playwright install ${{ matrix.name }}
      - name: Build the page
        if: ${{ !inputs.page_url }}
        run: npm run build --workspace @chalkline/web
      - name: This runner's public address
        run: curl -fsS https://api.ipify.org && echo
      - name: Open the board, draw, and wait for the others
        working-directory: packages/web
        env:
          PROBE_NAME: ${{ matrix.name }}
          OFFSET: ${{ matrix.offset }}
          ROOM: ${{ needs.room.outputs.room }}
          KEY: ${{ needs.room.outputs.key }}
          PARTICIPANTS: chromium,firefox,script
          BROWSERS: chromium,firefox
          LABEL: Drawn by draw-box in run ${{ github.run_id }}
          PAGE_URL: ${{ inputs.page_url }}
        run: node probe/browser.mjs
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.name }}
          path: packages/web/probe-${{ matrix.name }}.png
          if-no-files-found: ignore

  speech:
    name: Speech (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        name: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Install ${{ matrix.name }}
        working-directory: packages/web
        timeout-minutes: 8
        run: npx playwright install ${{ matrix.name }}
      - name: Build the page
        if: ${{ !inputs.page_url }}
        run: npm run build --workspace @chalkline/web
      - name: Turn speech on, and record what the browser does
        working-directory: packages/web
        env:
          BROWSER: ${{ matrix.name }}
          PAGE_URL: ${{ inputs.page_url }}
        run: node probe/speech.mjs
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-${{ matrix.name }}
          path: packages/web/speech-${{ matrix.name }}.png
          if-no-files-found: ignore

  script:
    name: Script (draw-box)
    needs: room
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build draw-box
        run: npm run build:node --workspace @chalkline/web
      - name: This runner's public address
        run: curl -fsS https://api.ipify.org && echo
      - name: Join the board, add the box, and wait until both browsers see it
        env:
          ROOM: ${{ needs.room.outputs.room }}
          KEY: ${{ needs.room.outputs.key }}
          LABEL: Drawn by draw-box in run ${{ github.run_id }}
        run: >-
          node packages/web/dist-node/draw-box.mjs
          --link "https://camshaft.github.io/chalkline/#room=$ROOM&key=$KEY"
          --label "$LABEL" --name script --wait-seen chromium,firefox --timeout 900
