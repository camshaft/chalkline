name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Lock file workflow runs CI on each commit it pushes to a branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` installs the versions package-lock.json pins, and fails where a
      # package.json no longer matches it: run the Lock file workflow on the branch
      # to write package-lock.json again.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Converts the script's labelled box in Node, without joining a room.
      - name: Convert draw-box's box
        run: node packages/web/dist-node/draw-box.mjs --print
      # Runs the local-network mode's bundle, which prints its usage and serves nothing.
      - name: Print the local-network mode's usage
        run: node packages/lan/dist/chalkline-lan.mjs --help
      # Starts the built chalkline-mcp on a new board, as an agent's client starts it, and calls
      # its tools: add_shapes adds a labelled rectangle, and get_board reads it back.
      - name: Run chalkline-mcp
        run: npm run smoke --workspace @chalkline/mcp
