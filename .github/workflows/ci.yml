name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository doesn't hold a lock file yet, so `npm install` resolves
      # the ranges in package.json. Switch to `npm ci` once a lock file is committed.
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Converts the script's labelled box in Node, without joining a room.
      - name: Convert draw-box's box
        run: node packages/web/dist-node/draw-box.mjs --print
