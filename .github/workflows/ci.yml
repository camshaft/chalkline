name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Lock file workflow runs CI on each commit it pushes to a branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` installs the versions package-lock.json pins, and fails where a
      # package.json no longer matches it: run the Lock file workflow on the branch
      # to write package-lock.json again.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Converts the script's labelled box in Node, without joining a room.
      - name: Convert draw-box's box
        run: node packages/web/dist-node/draw-box.mjs --print
      # Runs the local-network mode's bundle, which prints its usage and serves nothing.
      - name: Print the local-network mode's usage
        run: node packages/lan/dist/chalkline-lan.mjs --help
      # Starts the built chalkline-mcp on a new board, as an agent's client starts it, and calls
      # its tools: add_shapes adds a labelled rectangle, and get_board reads it back.
      - name: Run chalkline-mcp
        run: npm run smoke --workspace @chalkline/mcp

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      # Without --with-deps, as in the Probe workflow: the runner image holds the libraries
      # Chromium runs on.
      - name: Install Chromium
        working-directory: packages/lan
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Build
        run: npm run build
      # Serves the built page and the relay from this machine, opens the board in two Chromium
      # contexts, and starts the built chalkline-mcp on the same board: the helper adds two
      # labelled shapes and an arrow between them, and the test waits until both browsers show them.
      # A second test has one browser write a feedback over a rectangle the helper added: the
      # helper reads it, moves the rectangle and answers it, and the test waits until both
      # browsers show the answer in the chat.
      # It also opens a board in a desktop's window and a phone's, uses each of the page's controls
      # in its place in Excalidraw's UI, and keeps a screenshot of each layout.
      - name: Run the end-to-end test
        run: npm run test:e2e --workspace @chalkline/lan
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: packages/lan/e2e-*.png
          if-no-files-found: ignore

  # Keeps the end-to-end test's screenshots of a pull request on the screenshots branch, in a
  # directory named after the pull request's branch, so that the pull request's description shows
  # them from there. It runs for a pull request from a branch of this repository alone, since a
  # fork's pull request can't write here.
  screenshots:
    name: Keep the screenshots on the screenshots branch
    needs: e2e
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: screenshots-branch
    steps:
      - name: Download the screenshots
        uses: actions/download-artifact@v4
        with:
          name: e2e-screenshots
          path: shots
      - name: Push them to the screenshots branch
        env:
          BRANCH: ${{ github.head_ref }}
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          git init -q branch
          cd branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          if git fetch -q --depth 1 origin screenshots; then
            git checkout -q -b screenshots FETCH_HEAD
          else
            git symbolic-ref HEAD refs/heads/screenshots
          fi
          dir="${BRANCH//\//-}"
          rm -rf "$dir"
          mkdir -p "$dir"
          cp ../shots/*.png "$dir/"
          git add -A "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Screenshots of ${BRANCH} at ${GITHUB_SHA}"
          git push -q origin HEAD:screenshots

  measure:
    name: Board size measurement
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      # Without --with-deps, as in the End-to-end test job.
      - name: Install Chromium
        working-directory: packages/lan
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Build
        run: npm run build
      # Serves the built page and the relay from this machine, opens a board in Chromium, fills it
      # with 100 shapes and a new board with 4,000 through the built chalkline-mcp, and prints how
      # long the page takes on each board to load it again, to draw it zoomed in and zoomed out, and
      # to show the shapes that the helper's update_shape calls move. It fails where one update_shape
      # call costs the page more on the larger board, beyond the margin the measurement states.
      - name: Measure the page on boards of 100 and 4,000 shapes
        run: npm run measure --workspace @chalkline/lan

  readme:
    name: README steps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Claude Code's command line runs without updating itself or sending its own reports.
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Connect an agent adds chalkline-mcp to Claude Code with `claude mcp add`.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      # Runs the commands of README.md's Run the local mode and Connect an agent from this new
      # checkout, as a person runs them, starting with their `npm ci`: it opens the local mode's
      # board in two Chromium contexts, adds chalkline-mcp to Claude Code with the board's link,
      # starts the helper Claude Code was given, which adds a labelled rectangle both browsers
      # show, and runs the listener on a line of the board's transcript. It also opens the address
      # of Open a board and presses New board.
      - name: Run the README's steps
        run: node packages/lan/e2e/readme-steps.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: packages/lan/readme-*.png
          if-no-files-found: ignore
