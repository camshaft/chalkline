<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chalkline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #board {
        position: relative;
        display: flex;
        height: 100%;
      }
      #app {
        flex: 1;
        min-width: 0;
      }
      /*
       * The page's controls: the status badge, the name field and the speech buttons. Until the board
       * opens they sit at the page's top right. Once it opens, main.ts moves them into the element
       * Excalidraw's renderTopRightUI shows, and they take Excalidraw's island style and theme from its
       * variables, so they sit over the canvas and leave it the whole window.
       */
      .chalkline-controls {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        width: 16rem;
        max-width: calc(100vw - 2rem);
        box-sizing: border-box;
        padding: 0.25rem;
        font-family: var(--ui-font, system-ui, sans-serif);
        font-size: 0.875rem;
        color: var(--text-primary-color, #1b1b1f);
        background: var(--island-bg-color, #fff);
        border-radius: var(--border-radius-lg, 0.5rem);
        box-shadow: var(
          --shadow-island,
          0 0 1px rgba(0, 0, 0, 0.17),
          0 0 3px rgba(0, 0, 0, 0.08),
          0 7px 14px rgba(0, 0, 0, 0.05)
        );
        pointer-events: var(--ui-pointerEvents, auto);
      }
      .chalkline-controls [hidden] {
        display: none !important;
      }
      .chalkline-controls-row {
        display: flex;
        gap: 0.25rem;
        min-width: 0;
      }
      .chalkline-controls-row > .chalkline-button {
        flex: 1 1 auto;
      }
      .chalkline-controls-more {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .chalkline-button,
      .chalkline-status {
        height: var(--default-button-size, 2rem);
        box-sizing: border-box;
        padding: 0 0.6rem;
        font: inherit;
        color: inherit;
        white-space: nowrap;
        background: var(--color-surface-low, #ececf4);
        border: 1px solid transparent;
        border-radius: var(--border-radius-md, 0.375rem);
        cursor: pointer;
      }
      .chalkline-button:hover,
      .chalkline-status:hover {
        background: var(--button-hover-bg, #f1f0ff);
      }
      .chalkline-button:focus-visible,
      .chalkline-status:focus-visible,
      .chalkline-name input:focus-visible {
        outline: 2px solid var(--color-primary, #6965db);
        outline-offset: 1px;
      }
      .chalkline-button[aria-pressed='true'] {
        color: var(--color-on-primary-container, #030064);
        background: var(--color-surface-primary-container, #e0dfff);
        border-color: var(--color-brand-active, #4440bf);
      }
      .chalkline-button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .chalkline-status {
        flex: 1 1 auto;
        min-width: 0;
        text-align: left;
      }
      /* The badge shows the start of the status; its title, and a click or a tap, show the whole of it. */
      #status {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chalkline-status[aria-expanded='true'] {
        height: auto;
        min-height: var(--default-button-size, 2rem);
        padding-top: 0.4rem;
        padding-bottom: 0.4rem;
        white-space: normal;
      }
      .chalkline-name {
        display: block;
      }
      .chalkline-name input {
        width: 100%;
        height: var(--default-button-size, 2rem);
        box-sizing: border-box;
        padding: 0 0.5rem;
        font: inherit;
        color: inherit;
        background: var(--input-bg-color, #fff);
        border: 1px solid var(--input-border-color, #ced4da);
        border-radius: var(--border-radius-md, 0.375rem);
      }
      .chalkline-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* The toggle shows only where the controls collapse to one button, on a phone's narrow screen. */
      #controls-toggle {
        display: none;
      }
      body > .chalkline-controls {
        position: fixed;
        top: 0.75rem;
        right: 0.75rem;
        z-index: 20;
      }
      /*
       * On a desktop, the host is a flex item of zero width at the end of Excalidraw's top-right row, and
       * the controls hang below the row's right end, so the row and the toolbar keep their place.
       */
      .chalkline-host {
        position: relative;
        order: 99;
        align-self: stretch;
        width: 0;
        margin-left: -0.75rem;
      }
      .chalkline-host > .chalkline-controls {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
      }
      /* Excalidraw's main menu opens the connection settings once the board is open. */
      .chalkline-host #settings-button {
        display: none;
      }
      /*
       * On a phone, the controls take the left edge below the toolbar, as Excalidraw's own pen, lock and
       * hand buttons take the right edge, and collapse to the status and the More button.
       */
      .chalkline-host.chalkline-host--mobile {
        position: static;
        margin-left: 0;
      }
      .chalkline-host--mobile > .chalkline-controls {
        top: calc(5rem - var(--editor-container-padding, 1rem));
        right: auto;
        left: calc(var(--editor-container-padding, 1rem) * -1);
        width: 15rem;
        border: 1px solid var(--sidebar-border-color, #f1f0ff);
        border-left: 0;
        border-radius: 0 var(--border-radius-lg, 0.5rem) var(--border-radius-lg, 0.5rem) 0;
      }
      .chalkline-host--mobile #controls-toggle {
        display: block;
        flex: 0 0 auto;
      }
      .chalkline-host--mobile .chalkline-controls:not(.chalkline-controls--open) .chalkline-controls-more {
        display: none;
      }
      #transcript {
        position: absolute;
        /* Below the page's controls on a desktop, the Read agent messages aloud button among them. */
        top: 14.5rem;
        right: 1rem;
        /* --keyboard-inset is the height of the page a phone's on-screen keyboard covers (followKeyboard). */
        bottom: calc(1rem + var(--keyboard-inset, 0px));
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 22rem;
        max-width: calc(100% - 1rem);
        box-sizing: border-box;
        padding: 0.75rem;
        font-size: 0.9rem;
        color: #1b1b1f;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.15);
        --chalkline-muted: #666;
      }
      /*
       * On a phone, the chat opens as a sheet across the window's width, over the canvas, from the window's
       * bottom, or from the top of the on-screen keyboard while it shows, so that its Message field stays in
       * sight. followKeyboard sets the keyboard's height from the visual viewport.
       */
      #board:has(.chalkline-host--mobile) #transcript {
        top: auto;
        left: 0;
        right: 0;
        bottom: var(--keyboard-inset, 0px);
        width: auto;
        max-width: none;
        height: min(28rem, calc((100dvh - var(--keyboard-inset, 0px)) * 0.6));
        border-width: 1px 0 0;
        border-radius: 0.75rem 0.75rem 0 0;
        box-shadow: 0 -0.5rem 2rem rgba(0, 0, 0, 0.15);
      }
      #board:has(.excalidraw.theme--dark) #transcript {
        color: #e3e3e8;
        background: #232329;
        border-color: #46464f;
        color-scheme: dark;
        --chalkline-muted: #b8b8b8;
      }
      #transcript[hidden] {
        display: none;
      }
      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      #transcript h2 {
        margin: 0;
        font-size: 1rem;
      }
      #transcript p {
        margin: 0;
      }
      .speech-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .speech-heard {
        color: var(--chalkline-muted);
        font-style: italic;
      }
      .transcript-entries {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: auto;
        list-style: none;
      }
      .transcript-entries li {
        margin-bottom: 0.5rem;
      }
      .transcript-speaker {
        font-weight: 600;
      }
      .transcript-time {
        margin-left: 0.4rem;
        color: var(--chalkline-muted);
        font-size: 0.8rem;
      }
      .transcript-text {
        display: block;
        white-space: pre-wrap;
      }
      .transcript-empty {
        color: var(--chalkline-muted);
      }
      .chat-new-messages {
        align-self: center;
        padding: 0.15rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.85rem;
      }
      .chat-compose {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
      }
      .chat-compose textarea {
        flex: 1;
        min-width: 0;
        box-sizing: border-box;
        padding: 0.25rem 0.4rem;
        font: inherit;
        /* 16px, so that a phone doesn't zoom in as the field takes the focus. */
        font-size: 1rem;
        line-height: 1.25rem;
        resize: none;
        overflow-y: hidden;
      }
      .join-screen {
        max-width: 34rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      /* Where the window is too narrow for the join screen beside the controls, it starts below them. */
      @media (max-width: 68rem) {
        .join-screen {
          margin-top: 9rem;
        }
      }
      .join-screen form {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .join-screen label {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.2rem;
        font-size: 0.85rem;
      }
      .join-screen input {
        font: inherit;
      }
      .join-error {
        color: #b00020;
      }
      #settings {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 3rem 1rem;
        overflow: auto;
        background: rgba(0, 0, 0, 0.3);
      }
      #settings[hidden] {
        display: none;
      }
      .settings-panel {
        max-width: 40rem;
        padding: 1rem 1.25rem;
        background: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.25);
      }
      .settings-panel h2 {
        margin-top: 0;
      }
      .settings-panel label {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-size: 0.85rem;
      }
      .settings-panel textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: monospace;
      }
      .turn-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .settings-errors {
        color: #b00020;
      }
      .settings-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      /*
       * The controls' second row holds the microphone, Chat and Feedback buttons, and goes on to a second
       * line where the controls lack the room for the three.
       */
      #controls-more > .chalkline-controls-row {
        flex-wrap: wrap;
      }
      /*
       * Feedback (designs/chalkline A13): the layer over the canvas, which feedback.ts fills with the
       * outline of each open feedback, and with the rectangle a person drags in feedback mode and its text
       * box. Outside feedback mode it lets each pointer event through to the canvas; in feedback mode a drag
       * on it marks an area. It sits over the canvas and under the chat.
       */
      #feedback-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        overflow: hidden;
        pointer-events: none;
      }
      #feedback-layer.feedback-active {
        pointer-events: auto;
        cursor: crosshair;
        touch-action: none;
      }
      #feedback-layer [hidden] {
        display: none;
      }
      .feedback-outline,
      .feedback-draft {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed #e8590c;
        border-radius: 0.25rem;
      }
      .feedback-draft {
        border-color: #1971c2;
        background: rgba(25, 113, 194, 0.08);
      }
      .feedback-outline.feedback-shown {
        border: 3px solid #1971c2;
      }
      .feedback-outline-name {
        position: absolute;
        bottom: 100%;
        left: -2px;
        padding: 0 0.3rem;
        font-size: 0.75rem;
        line-height: 1.4;
        color: #fff;
        white-space: nowrap;
        background: #e8590c;
        border-radius: 0.25rem 0.25rem 0 0;
      }
      .feedback-shown .feedback-outline-name {
        background: #1971c2;
      }
      .feedback-hint,
      .feedback-box {
        position: absolute;
        display: flex;
        gap: 0.5rem;
        box-sizing: border-box;
        padding: 0.5rem;
        font-size: 0.875rem;
        color: #1b1b1f;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.15);
        cursor: auto;
      }
      .feedback-hint {
        top: 1rem;
        left: 50%;
        align-items: center;
        max-width: calc(100% - 2rem);
        transform: translateX(-50%);
      }
      .feedback-box {
        flex-direction: column;
        width: 18rem;
        max-width: calc(100% - 1rem);
      }
      .feedback-field {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        resize: vertical;
      }
      .feedback-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      #board:has(.excalidraw.theme--dark) .feedback-hint,
      #board:has(.excalidraw.theme--dark) .feedback-box {
        color: #e3e3e8;
        background: #232329;
        border-color: #46464f;
        color-scheme: dark;
      }
      /* A feedback in the chat's list, with its tag, how many shapes it covers, and Show. */
      .transcript-feedback {
        padding-left: 0.5rem;
        border-left: 3px solid #e8590c;
      }
      .transcript-feedback-tag {
        margin-left: 0.4rem;
        font-size: 0.8rem;
        color: #e8590c;
      }
      .transcript-feedback-shapes {
        margin-right: 0.5rem;
        font-size: 0.8rem;
        color: var(--chalkline-muted);
      }
    </style>
  </head>
  <body>
    <div id="controls" class="chalkline-controls">
      <div class="chalkline-controls-row">
        <button id="status-badge" class="chalkline-status" type="button" aria-expanded="false">
          <span id="status">Joining the room...</span>
        </button>
        <button
          id="controls-toggle"
          class="chalkline-button"
          type="button"
          aria-expanded="false"
          aria-controls="controls-more"
        >
          More
        </button>
      </div>
      <div id="controls-more" class="chalkline-controls-more">
        <label class="chalkline-name">
          <span class="chalkline-visually-hidden">Your name</span>
          <input id="name" type="text" autocomplete="nickname" title="Your name, which the others see by your cursor" />
        </label>
        <div class="chalkline-controls-row">
          <button id="mic" class="chalkline-button" type="button" aria-pressed="false" hidden>Turn on speech</button>
          <button
            id="transcript-button"
            class="chalkline-button"
            type="button"
            aria-expanded="false"
            aria-controls="transcript"
            hidden
          >
            Chat
          </button>
          <button id="feedback-button" class="chalkline-button" type="button" aria-pressed="false" hidden>Feedback</button>
          <button id="settings-button" class="chalkline-button" type="button">Connection settings</button>
        </div>
        <button id="read-aloud" class="chalkline-button" type="button" aria-pressed="false" hidden>Read agent messages aloud</button>
      </div>
    </div>
    <input id="open-file" type="file" accept=".excalidraw,application/json,application/vnd.excalidraw+json" hidden />
    <div id="settings" hidden></div>
    <div id="board">
      <div id="app"></div>
      <div id="feedback-layer"></div>
      <aside id="transcript" aria-label="Chat" hidden></aside>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
