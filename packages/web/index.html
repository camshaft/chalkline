<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chalkline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.4rem 0.75rem;
        font-size: 0.9rem;
        border-bottom: 1px solid #ddd;
      }
      #status {
        flex: 1;
      }
      #bar label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      #name {
        font: inherit;
        width: 12rem;
      }
      #app {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <div id="status">Joining the room...</div>
      <label>Your name <input id="name" type="text" autocomplete="nickname" /></label>
    </header>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
